[project]
name = "my-agent-api"
version = "0.1.0"
description = "智能客服问答 API —— RAG 检索 + LangGraph Agent 编排"
readme = "README.md"
# ⚠️ 原来是 ">=3.14"，但仓库自带的 venv 与全部实测都是 Python 3.12 ——
#    声明 3.14 会让 `uv sync` 在有 3.12 的机器上直接拒绝解析，克隆下来根本装不上。
#    代码里没有 3.12+ 专属语法（无 PEP 695、无 itertools.batched），3.11 起即可。
requires-python = ">=3.11"
# 依赖与 requirements.txt **保持同步**（两边都改，别只改一份）：
#   之前这里漏了 redis / httpx / pytest / tiktoken / sentence-transformers /
#   rank-bm25 / jieba，用 uv 装出来的环境跑不起来。
dependencies = [
    # 编排与 LLM
    "langchain>=1.3.15",
    "langchain-core>=1.5.4",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.5.0",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "langgraph-checkpoint>=4.2.0",
    "langgraph-prebuilt>=1.1.0",
    "langgraph-sdk>=0.4.2",
    "openai>=2.0",
    # Web 服务
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.0",
    # 检索层
    "langchain-chroma>=0.2",
    "chromadb>=1.0",
    "rank-bm25>=0.2.2",
    "jieba>=0.42.1",
    "sentence-transformers>=3.0",
    # 文档解析
    "pymupdf>=1.24",
    "pymupdf4llm>=0.0.17",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "pytesseract>=0.3.10",
    "pillow>=10.0",
    # 存储与云服务
    "PyMySQL>=1.1.0",
    "redis>=5.0",
    "httpx>=0.27",
    # 配置
    "python-dotenv>=1.0",
    # MCP
    "mcp>=1.2",
    "fastmcp>=2.0",
]

[project.optional-dependencies]
# 精确 token 计数（不装则退化为字符粗估，见 context_budget.py）
budget = ["tiktoken>=0.7"]

[dependency-groups]
dev = ["pytest>=8.0"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
