# ════════════════════════════════════════════════════════════════════════
# 智能客服问答 API —— 全套部署编排（一份文件起 mysql + redis + api + web + nginx）
#
# 这个文件只回答「这套系统由哪些容器组成、怎么连」；每个容器里装什么，由各自的
# Dockerfile 决定，分工是：
#     后端环境 / 依赖   → ./Dockerfile                    （本仓库根目录）
#     前端环境 / 依赖   → <前端项目>/Dockerfile            （由 FRONTEND_DIR 指向）
#     基础服务与入口    → 本文件：mysql / redis / nginx（官方镜像，无需自建）
#
# 服务器上一条命令起全套（镜像按需构建）：
#     cp .env.example .env      # 填真实 key、MYSQL_PASSWORD、AUTH_JWT_SECRET
#     docker compose up -d --build
#     docker compose exec api python -m db.init_schema      # 建表 + 结构自检
#     docker compose exec api python -m rag.acl_backfill    # 存量文档 ACL 回填（幂等）
#     docker compose exec api python -m auth.bootstrap --username admin
#
# 流量只有一层入口（api / web 都不对宿主机发布端口）：
#     nginx :80/:443
#       ├─ /                      ──▶ web（前端容器，自带静态服务器，默认 80）
#       └─ /api/ /health /ready /metrics ──▶ api（后端容器 :8000）──▶ mysql / redis
#
# ⚠️ 把这份 compose 单独拿到别处（比如独立的部署目录）时，要一起对齐三样：
#     1) 后端构建上下文：build.context 默认 `.`（= 本文件所在目录）→ 指到后端仓库
#     2) 前端构建上下文：环境变量 FRONTEND_DIR（默认 ../frontend，相对本文件）
#     3) nginx 配置：./deploy/nginx/default.conf（少了它 nginx 容器没有站点配置）
#
# 前端 Dockerfile 的契约（它在前端项目里，不归本仓库管）：
#     - 多阶段构建，最终镜像里跑一个静态服务器并监听 80（本项目按 `nginx:alpine` 写，
#       换别的服务器就改下面 nginx 配置里的 upstream web_frontend 端口）
#     - 前端请求后端时请用**同源**地址 `/api`：同源不需要 CORS，
#       而后端 CORS 白名单目前只允许 http://localhost:5173（cors.py），
#       跨域部署会被浏览器直接拦掉（详见 README 的部署说明）。
# ════════════════════════════════════════════════════════════════════════

services:
  # ── 基础服务 1/2：MySQL ────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 文档正文里有中文与 emoji，utf8mb4 是必须的（utf8 三字节存不下）
      #
      # ── 小内存机器（4GB 云服务器）：把 MySQL 的内存占用钉死 ──────────
      # MySQL 8 默认按机器总内存自动放大 InnoDB 缓冲池，并开着 performance_schema，
      # 在 4GB 上会和 api 容器（torch 推理）抢内存，现象是构建/首次上传时进程
      # 被 OOM Killer 干掉（日志里只有一个 Killed）。知识库这个量级 256M 足够。
      - --innodb-buffer-pool-size=256M
      - --performance-schema=OFF
      - --max-connections=50
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 里设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rag}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 里设置 MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      # 只绑到宿主机回环：数据库不该对整个网络开放。生产不需要从宿主机连库的话，
      # 整段删掉即可（同网络的 api 容器用服务名 mysql:3306 照样连得上）。
      - "127.0.0.1:3306:3306"
    healthcheck:
      # $$ 是转义：让容器内的 shell 去展开，而不是 compose 在宿主机上展开
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # Docker 默认只给 10s 优雅退出，InnoDB 在慢盘/小内存机上关不干净会走崩溃恢复
    stop_grace_period: 60s
    restart: unless-stopped

  # ── 基础服务 2/2：Redis ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      # 会话历史 + 转人工计数 + 令牌撤销集合：都允许在内存压力下被淘汰，
      # 但不能让 Redis 因为 OOM 直接拒绝写入（那会让主链路报错）
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── 后端：本仓库代码，用 ./Dockerfile 构建 ─────────────────────────────
  api:
    build:
      context: .
      # 三个构建期镜像源，默认官方源。想换国内/内网源**不用改 Dockerfile**，
      # 在 .env 里加同名变量即可（.env 不进 git，因此不会和 git pull 冲突）：
      #   APT_MIRROR=mirrors.aliyun.com
      #   PIP_INDEX_URL=http://mirrors.cloud.aliyuncs.com/pypi/simple/
      #   TORCH_INDEX_URL=http://mirrors.cloud.aliyuncs.com/pytorch-wheels/cpu
      args:
        APT_MIRROR: ${APT_MIRROR:-deb.debian.org}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    # 给构建产物一个固定名字：以后后端接入 CI 时，去掉 build 直接拉这个镜像即可
    image: my-agent-api:latest
    env_file:
      - .env
    environment:
      # 覆盖 .env 里的本机地址：容器网络里要用服务名
      MYSQL_URL: mysql+pymysql://${MYSQL_USER:-app}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-rag}?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      # 默认配置是 cuda；纯 CPU 容器里显式设成 cpu，省掉一次必然失败的 CUDA 初始化
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
      RERANK_DEVICE: ${RERANK_DEVICE:-cpu}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # ⚠️ 前面站了 nginx，这一项要开：否则 request.client 是 nginx 容器的 IP，
      #    审计日志（auth/audit.py 的 client_ip）会把所有操作都记成网关的 IP。
      #    （限流不受影响：它按账号 principal.user_id 计，见 rate_limit.py。）
      #    默认开是安全的：api **没有**对宿主机发布端口，只能从 compose 网络内访问，
      #    而 nginx 用 $remote_addr 覆盖式写入 XFF（见 deploy/nginx/default.conf），
      #    伪造的 XFF 到不了后端。
      #    哪天你把 api 端口直接暴露到公网，就必须改回 0，否则审计 IP 可伪造。
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-1}
    volumes:
      - ./knowledge_base:/app/knowledge_base
      - ./chroma_db:/app/chroma_db
      # 本地 embedding 模型（183MB，只读）。没传的话会走下面的 HF 缓存自动下载。
      # ⚠️ 这两个 bind mount 的**宿主机属主**要允许 uid 10001 写入（应用要往里写
      #    上传的文档与向量库），首次部署前：
      #        mkdir -p knowledge_base chroma_db
      #        sudo chown -R 10001:10001 knowledge_base chroma_db
      #    否则上传会 EACCES。命名卷（下面几个）会继承镜像里的属主，不用管。
      - ./embbding_models:/app/embbding_models:ro
      # 精排已改用智谱 glm-4.5-air（见 rag/glm_reranker.py），本地精排模型不再需要，
      # 那 2.19GB 也就**不用**传上服务器了（4GB 机器上正好省下来）：
      # - ./Reank_models:/app/Reank_models:ro
      # HF 缓存：本地没放模型时 SentenceTransformer 会下载到这里。
      # 不挂卷的话它在镜像层里 —— 每次 --build / 重建容器都要重新下一遍（慢且费流量）。
      - hf_home:/app/models/hf
      # BM25 索引缓存与 sqlite checkpoint：都是「外置」的落盘位置，
      # 用命名卷让它们跨容器重建保留下来
      - bm25_cache:/app/bm25_cache
      - app_data:/app/data
    # 不再对宿主机发布端口：入口统一走 nginx（同网络的 nginx 用服务名 api:8000 访问）。
    # 需要从宿主机直接排障时，临时加上这一行再 up：
    #   ports: ["127.0.0.1:8000:8000"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # 用 /ready（会真的探依赖）而不是 /health：只有依赖可用时才该接流量
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # 镜像里 uvicorn 设了 --timeout-graceful-shutdown 30（在跑的问答不该被硬砍），
    # 而 Docker 默认只等 10s 就 SIGKILL —— 这里必须比 30 大，那条设置才真的生效。
    stop_grace_period: 40s
    restart: unless-stopped

  # ── 前端：用前端项目自己的 Dockerfile 构建 ─────────────────────────────
  web:
    build:
      # 前端项目相对**本文件**的位置。默认 ../frontend，即「后端仓库的隔壁」；
      # 不在这个位置就在 .env 里写 FRONTEND_DIR=/absolute/or/relative/path。
      context: ${FRONTEND_DIR:-../frontend}
      dockerfile: Dockerfile
      # 前端如果需要在**构建期**注入后端地址（Vite: VITE_API_BASE），把下面放开，
      # 并确保前端 Dockerfile 里声明了同名 ARG —— 同源 /api 最省事，无需 CORS：
      # args:
      #   VITE_API_BASE: ${VITE_API_BASE:-/api}
    image: my-agent-api-web:latest
    # 不对宿主机发布端口：由入口 nginx 反代（upstream web_frontend）。
    # 前端镜像必须监听 80；换了端口就同步改 deploy/nginx/default.conf。
    restart: unless-stopped

  # ── 入口：nginx（静态前端 + 后端 API 反代 + SSE 长连接）───────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      # 上 HTTPS 时放开 443 与下面的证书挂载（配置模板见 deploy/nginx/default.conf 末尾）：
      # - "443:443"
    volumes:
      # 只读挂载：把容器自带的默认站点替换成本项目的配置
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # 证书目录（放 fullchain.pem / privkey.pem）。不用 HTTPS 时可以整段删掉。
      # - ./deploy/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      # 用 service_started 而不是 service_healthy：前端静态页不该被后端就绪状态连坐。
      # 后端还没起来时 /api 会短暂 502，起来后自动恢复。
      - api
      - web
    healthcheck:
      # nginx:alpine 里是 busybox wget，没有 curl。打的是 nginx 自己的 /healthz，
      # 不探后端 —— 后端挂了不该让入口容器反复重启。
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  bm25_cache:
  app_data:
  hf_home:

networks:
  # 把默认网络钉成固定名字：容器间用服务名互相访问，将来把这份 compose 拆成
  # 「基础设施」与「应用」两份时，可以用同一个 external 网络把它们接起来。
  default:
    name: agent-net
