# ════════════════════════════════════════════════════════════════════════
# 入口 nginx —— 静态前端 + 后端 API 反代 + SSE 长连接
#
# 挂载位置：compose 以只读方式覆盖容器里的 /etc/nginx/conf.d/default.conf
# 上游主机名 api / web 来自 compose 的服务名（Docker 内置 DNS 解析）。
#
# 下面有三处「不是默认值就行」，每一处都对应后端已经定死的口径，改错不会报错、
# 只会静默劣化：
#   1) client_max_body_size：后端单文件上限 50MB（body_limit.py），nginx 默认只给 1m；
#   2) proxy_buffering off + 长 read_timeout：问答走 SSE（api/chat.py），一缓冲就没了流式；
#   3) X-Forwarded-For 用 $remote_addr **覆盖**：后端取 XFF 的第一段（auth/deps.py）。
# ════════════════════════════════════════════════════════════════════════

upstream api_backend {
    server api:8000;
}

upstream web_frontend {
    server web:80;
}

server {
    listen 80;
    # 刻意不写 listen [::]:80：容器里 IPv6 常被禁用，IPv6 监听会让 nginx 直接起不来
    server_name _;
    server_tokens off;                 # 不回 nginx 版本号

    # 后端单文件上限 50MB + multipart 边界余量 ≈ 51MB（body_limit.py）。
    # nginx 默认只有 1m：不放开的话大文件在 nginx 这层就被 413 挡掉，
    # 后端那句明确的中文提示（"请求体过大…"）永远看不到。
    client_max_body_size 60m;

    # ── 长连接 / SSE（流式问答）────────────────────────────────────────
    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    # 关缓冲：否则 nginx 会攒够一块才吐给前端，"打字机"效果消失，
    # 表现为「转很久，然后整段答案一次性打出来」。
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;

    # ── 转发头 ────────────────────────────────────────────────────────
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # ⚠️ 覆盖，不能用 $proxy_add_x_forwarded_for 追加：
    #    后端 client_ip() 取的是 XFF 的**第一段**（auth/deps.py），追加写法会把客户端
    #    自己伪造的那段留在最前面 —— 等于"被记成哪个 IP"由调用方决定。
    #    受影响的不是限流（限流按**账号**计，见 rate_limit.py:212 的 principal.user_id），
    #    而是审计日志（auth/audit.py 的 client_ip）：写错会全记成网关 IP，
    #    或者更糟 —— 记成攻击者随便填的一个 IP。
    #    nginx 是唯一入口、api 没有对外发布端口，所以 $remote_addr 就是真实客户端。
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # 入口自身的健康检查（compose 里 nginx 容器的 healthcheck 打这里）：
    # 不探后端 —— 后端挂了不该让入口容器反复重启。
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 后端探针与指标原样透传（/metrics 默认要求 admin，见 api/system.py）。
    # 外部监控/负载均衡按约定打根路径，所以不套 /api 前缀。
    location = /health  { proxy_pass http://api_backend; }
    location = /ready   { proxy_pass http://api_backend; }
    location = /metrics { proxy_pass http://api_backend; }

    # 后端 API：**保留 /api 前缀**。后端路由本身就是 /api/...（router/router.py），
    # 所以 proxy_pass 后面不能带 URI —— 写成 http://api_backend/ 会把 /api 剥掉、全 404。
    location /api/ {
        proxy_pass http://api_backend;
    }

    # 其余全部交给前端容器（SPA 的 try_files 回退由前端镜像自己的配置负责）
    location / {
        proxy_pass http://web_frontend;
    }

    # 将来要加 WebSocket 时单独写一个 location 带 Upgrade/Connection 头；
    # 不要在 server 级统一加：那样普通请求也会走 upgrade，破坏到上游的连接复用。
}

